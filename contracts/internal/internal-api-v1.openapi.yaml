openapi: 3.1.0
info:
  title: SuperAgentSystem Internal API
  version: v1
  summary: Launch Spec v1 frozen internal contracts with Memory System V3 single-tenant extension
servers:
  - url: https://internal.super-agent.local
components:
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
    Scope:
      name: X-Scope
      in: header
      required: true
      schema:
        type: string
    TraceId:
      name: X-Trace-Id
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  responses:
    ErrorResponse:
      description: Standard error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error_code, message, trace_id, retryable, details]
      properties:
        error_code:
          type: string
        message:
          type: string
        trace_id:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
    Step:
      type: object
      required:
        - step_key
        - step_order
        - title
        - step_type
        - dependency_keys
        - risk_level
        - side_effect_class
        - input_payload
        - expected_output
        - acceptance_criteria
      properties:
        step_key:
          type: string
        step_order:
          type: integer
        title:
          type: string
        step_type:
          type: string
        dependency_keys:
          type: array
          items:
            type: string
        risk_level:
          type: string
          enum: [low, medium, high, critical]
        side_effect_class:
          type: string
          enum: [none, read_only, external_resource, state_change, approval]
        capability_hint:
          type: string
        compensation_hint:
          type: object
          additionalProperties: true
        input_payload:
          type: object
          additionalProperties: true
        expected_output:
          type: object
          additionalProperties: true
        acceptance_criteria:
          type: array
          items:
            type: object
            additionalProperties: true
    PlanRequest:
      type: object
      required: [task_request_id, task_type, goal, normalized_envelope, resident_context, retrieval_budget]
      properties:
        task_request_id:
          type: string
          format: uuid
        task_type:
          type: string
        goal:
          type: string
        normalized_envelope:
          type: object
          additionalProperties: true
        resident_context:
          type: object
          additionalProperties: true
        retrieval_budget:
          type: object
          additionalProperties: true
    PlanResponse:
      type: object
      required: [task_plan_id, plan_version, risk_level, acceptance_criteria, steps]
      properties:
        task_plan_id:
          type: string
          format: uuid
        plan_version:
          type: integer
        risk_level:
          type: string
        acceptance_criteria:
          type: array
          items:
            type: object
            additionalProperties: true
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"
    ResolveRequest:
      type: object
      required: [task_plan_id, task_step_id, step_type, risk_level, side_effect_class, required_scopes, fingerprint_context]
      properties:
        task_plan_id:
          type: string
          format: uuid
        task_step_id:
          type: string
          format: uuid
        step_type:
          type: string
        risk_level:
          type: string
        side_effect_class:
          type: string
        required_scopes:
          type: array
          items:
            type: string
        fingerprint_context:
          type: object
          additionalProperties: true
    ResolveResponse:
      type: object
      required: [resolved_capability_id, candidate_capabilities, approval_required, resolution_reason]
      properties:
        resolved_capability_id:
          type: string
          format: uuid
        candidate_capabilities:
          type: array
          items:
            type: object
            additionalProperties: true
        approval_required:
          type: boolean
        resolution_reason:
          type: string
    DispatchRequest:
      type: object
      required: [task_request_id, task_plan_id, task_step_id, resolved_capability_id, dispatch_payload, precheck_token]
      properties:
        task_request_id:
          type: string
          format: uuid
        task_plan_id:
          type: string
          format: uuid
        task_step_id:
          type: string
          format: uuid
        resolved_capability_id:
          type: string
          format: uuid
        dispatch_payload:
          type: object
          additionalProperties: true
        precheck_token:
          type: string
    DispatchResponse:
      type: object
      required: [dispatch_status, attempt_no, execution_reference, journal_checkpoint, stream_state]
      properties:
        dispatch_status:
          type: string
        attempt_no:
          type: integer
        execution_reference:
          type: object
          additionalProperties: true
        journal_checkpoint:
          type: string
        stream_state:
          type: string
          enum: [provisional, committed, revoked, replanned, blocked]
    MemoryCandidatePreview:
      type: object
      required:
        - source_type
        - source_ref
        - artifact_tag
        - verification_status
        - side_effect_class
        - fingerprint_status
        - candidate_payload
      properties:
        source_type:
          type: string
        source_ref:
          type: string
        artifact_tag:
          type: string
        error_code:
          type: string
        verification_status:
          type: string
        side_effect_class:
          type: string
        fingerprint:
          type: string
        fingerprint_status:
          type: string
          enum: [matched, matched_or_na, mismatch, unknown]
        candidate_payload:
          type: object
          additionalProperties: true
        llm_refined_payload:
          type: object
          additionalProperties: true
    VerifyRequest:
      type: object
      required: [task_request_id, task_plan_id, verification_phase, expected_state, observed_state]
      properties:
        task_request_id:
          type: string
          format: uuid
        task_plan_id:
          type: string
          format: uuid
        task_step_id:
          type: string
          format: uuid
        verification_phase:
          type: string
          enum: [precheck, postcheck, acceptance, cleanup]
        expected_state:
          type: object
          additionalProperties: true
        observed_state:
          type: object
          additionalProperties: true
    VerifyResponse:
      type: object
      required: [verification_result_id, verdict, evidence_payload]
      properties:
        verification_result_id:
          type: string
          format: uuid
        verdict:
          type: string
          enum: [passed, failed, waived]
        failure_event_id:
          type: string
          format: uuid
        evidence_payload:
          type: object
          additionalProperties: true
        precheck_token:
          type: string
        breaker_state:
          type: string
        memory_candidate_preview:
          $ref: "#/components/schemas/MemoryCandidatePreview"
    CleanupRequest:
      type: object
      required: [task_request_id, task_plan_id, task_step_id, cleanup_status, journal_cursor, capsule_id, dependency_state]
      properties:
        task_request_id:
          type: string
          format: uuid
        task_plan_id:
          type: string
          format: uuid
        task_step_id:
          type: string
          format: uuid
        cleanup_status:
          type: string
        journal_cursor:
          type: integer
        capsule_id:
          type: string
          format: uuid
        dependency_state:
          type: string
          enum: [DOWN, HALF-OPEN, UP]
    CleanupResponse:
      type: object
      required: [cleanup_status, drift_detected, scope_frozen, reconciliation_required]
      properties:
        cleanup_status:
          type: string
        drift_detected:
          type: boolean
        dlq_item_id:
          type: string
          format: uuid
        scope_frozen:
          type: boolean
        reconciliation_required:
          type: boolean
    MemoryQueryRequest:
      type: object
      properties:
        kind:
          type: string
          enum: [resident, factual, procedural, summary, candidate]
        task_request_id:
          type: string
          format: uuid
        fingerprint:
          type: string
        limit:
          type: integer
      additionalProperties: false
    MemoryQueryResponse:
      type: object
      required: [kind, tenant_id, scope, single_tenant_mode, items]
      properties:
        kind:
          type: string
        tenant_id:
          type: string
        scope:
          type: string
        single_tenant_mode:
          type: boolean
        items:
          type: array
          items:
            type: object
            additionalProperties: true
    MemoryCandidateRequest:
      type: object
      required:
        - task_request_id
        - task_step_id
        - source_type
        - source_ref
        - artifact_tag
        - verification_status
        - side_effect_class
        - fingerprint_status
        - candidate_payload
      properties:
        task_request_id:
          type: string
          format: uuid
        task_step_id:
          type: string
          format: uuid
        source_type:
          type: string
        source_ref:
          type: string
        artifact_tag:
          type: string
        layer:
          type: string
          enum: [rule, memory, skill, knowledge, evidence]
          description: 路由权威字段。指定后路由依据此字段。
        error_code:
          type: string
        verification_status:
          type: string
        side_effect_class:
          type: string
        fingerprint:
          type: string
        fingerprint_status:
          type: string
          enum: [matched, matched_or_na, mismatch, unknown]
        candidate_payload:
          type: object
          additionalProperties: true
        llm_refined_payload:
          type: object
          additionalProperties: true
    MemoryCandidateResponse:
      type: object
      required:
        - accepted
        - candidate_hash
        - candidate_id
        - candidate_status
        - routing_decision
        - persist_target
        - storage_decision
      properties:
        accepted:
          type: boolean
        candidate_hash:
          type: string
        candidate_id:
          type: string
          format: uuid
        candidate_status:
          type: string
          enum: [extracted, ranked, routed, persisted, dropped, blocked]
        routing_decision:
          type: string
        persist_target:
          type: string
          enum: [memory, rule, skill, resident_candidate, summary_only, drop, block]
        storage_decision:
          type: string
        persisted_object_id:
          type: string
          format: uuid
    MemoryRetrieveRequest:
      type: object
      required: [task_request_id, query, fingerprint_status]
      properties:
        task_request_id:
          type: string
          format: uuid
        query:
          type: string
        runtime_summary:
          type: object
          additionalProperties: true
        fingerprint:
          type: string
          description: Required when include_procedural=true.
        fingerprint_status:
          type: string
          enum: [matched, matched_or_na, mismatch, unknown]
          description: Mandatory retrieval decision input. Procedural memory enters the high-weight path only when fingerprint_status=matched.
        include_procedural:
          type: boolean
        include_factual:
          type: boolean
        limit:
          type: integer
        task_type:
          type: string
          enum: [design, execution, debugging, governance, review, ingestion, integration, answer]
        task_phase:
          type: string
          enum: [planning, design, coding, testing, review, governance, reporting, integration]
          description: Optional lifecycle phase for rule routing. When omitted, the service derives it from task_type.
        host:
          type: string
          description: Optional host/client identifier such as codex or claude_code for task binding.
        project_ref:
          type: string
          description: Optional project identifier used by task binding.
        operation_intent:
          type: string
          description: Optional operation that may trigger rule checkpoints or gates, such as write_host_config.
        context_budget_tokens:
          type: integer
        existing_bundle_id:
          type: string
          format: uuid
        existing_query_hash:
          type: string
        layer_versions:
          type: object
          additionalProperties: true
        required_layers:
          type: array
          items:
            type: string
        forbidden_layers:
          type: array
          items:
            type: string
        compression_mode:
          type: string
          enum: [none, light, aggressive, evidence_only]
        attention_layout:
          type: string
    MemoryRetrieveResponse:
      type: object
      required:
        - runtime_summary
        - conversation_summary
        - resident_snapshot
        - rules
        - factual_memory
        - procedural_memory
        - gates
      properties:
        bundle_id:
          type: string
          format: uuid
        runtime_summary:
          type: object
          additionalProperties: true
        conversation_summary:
          type: array
          items:
            type: object
            additionalProperties: true
        resident_snapshot:
          type: array
          items:
            type: object
            additionalProperties: true
        rules:
          type: array
          items:
            type: object
            additionalProperties: true
        factual_memory:
          type: array
          items:
            type: object
            additionalProperties: true
        procedural_memory:
          type: array
          items:
            type: object
            additionalProperties: true
        synthesized_knowledge:
          type: array
          items:
            type: object
            additionalProperties: true
        evidence_index:
          type: array
          items:
            type: object
            additionalProperties: true
        layer_versions:
          type: object
          additionalProperties: true
        assembly_context:
          type: object
          additionalProperties: true
        context_package:
          type: object
          additionalProperties: true
        gates:
          type: object
          additionalProperties: true
        metacognition:
          $ref: "#/components/schemas/MetacognitionAssessment"
    MetacognitionAssessment:
      type: object
      description: |
        Per-query 元认知评估：针对当前 retrieve 的查询，回答三个问题——
        1. 我有多大把握？（overall_confidence + confidence_basis）
        2. 我的高置信知识覆盖了哪些方面？（coverage_areas）
        3. 我明确不知道什么？（knowledge_gaps + boundary.unknown_aspects）

        不是对知识库的全局统计，而是基于本次召回结果计算的边界评估。
        这是从 annotation-driven 转向 outcome-driven 的元认知输出：
        系统不再只说"有 N 条知识"，而是说"对于这个问题，我知道的边界在哪里"。
      required:
        - overall_confidence
        - confidence_basis
        - boundary
        - coverage_areas
        - knowledge_gaps
        - recommended_actions
        - retrieve_quality
        - method
      properties:
        overall_confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: |
            本次 retrieve 的整体置信度。综合 layer_coverage / avg_item_confidence /
            high_utility_ratio / evidence_backed_ratio 四个加权计算。
            0.7+ 高置信；0.4-0.7 部分覆盖；<0.4 知识不足。
        confidence_basis:
          type: object
          required:
            - layer_coverage
            - avg_item_confidence
            - high_utility_ratio
            - evidence_backed_ratio
          properties:
            layer_coverage:
              type: number
              format: float
              minimum: 0
              maximum: 1
              description: 4 个核心层（rules/factual/procedural/synthesized）中命中的比例。
            avg_item_confidence:
              type: number
              format: float
              minimum: 0
              maximum: 1
              description: 召回条目的平均 confidence_score（无 confidence 字段按 0.5 默认）。
            high_utility_ratio:
              type: number
              format: float
              minimum: 0
              maximum: 1
              description: utility_score >= 0.7 的条目占比（无 utility 视为 0）。
            evidence_backed_ratio:
              type: number
              format: float
              minimum: 0
              maximum: 1
              description: synthesized_knowledge 中有 evidence 支撑的比例。
        retrieve_quality:
          type: string
          enum: [good, partial, poor]
          description: |
            召回质量评估，区分"知识真没有" vs "有但没召回"。
            基于 term_hit_ratio（查询词命中率）三态：
            - good (>= 0.6)：查询词大部分命中，召回正常
            - partial (0.3-0.6)：部分命中，可能召回有问题
            - poor (< 0.3)：查询词几乎没命中，知识库真没有 OR 召回算法严重失败
            用途：1) 修正 LLM trigger 逻辑 2) 归档保护
        method:
          type: string
          enum: [rule, llm, llm_fallback]
          description: |
            本次元认知的生成方式。
            - rule：规则版本，confidence >= 0.4 或 retrieve_quality='poor'
            - llm：LLM 推理，confidence < 0.4 且 retrieve_quality='good' 或 'partial'
            - llm_fallback：LLM 失败时回退规则版本
        boundary:
          type: object
          required:
            - status
            - covered_aspects
            - uncertain_aspects
            - unknown_aspects
          properties:
            status:
              type: string
              enum: [covered, partial, unknown]
              description: |
                covered = 高置信覆盖查询全部核心方面；
                partial = 部分方面有覆盖，部分缺失；
                unknown = 关键方面均无召回。
            covered_aspects:
              type: array
              items:
                type: string
              description: 高置信覆盖的方面（从召回 title 聚类）。
            uncertain_aspects:
              type: array
              items:
                type: string
              description: 召回了但置信度低或无 utility 信号的方面。
            unknown_aspects:
              type: array
              items:
                type: string
              description: 查询关键词中无任何召回命中的方面。
        coverage_areas:
          type: array
          items:
            type: object
            required:
              - area
              - layer_hits
              - confidence
              - item_count
            properties:
              area:
                type: string
                description: 方面名称（从召回条目的 title 或关键词聚类）。
              layer_hits:
                type: array
                items:
                  type: string
                description: 该方面命中的层级（rules/factual_memory/procedural_memory/synthesized_knowledge）。
              confidence:
                type: number
                format: float
                minimum: 0
                maximum: 1
                description: 该方面的综合置信度（item 平均）。
              item_count:
                type: integer
                minimum: 0
                description: 该方面下的条目数。
        knowledge_gaps:
          type: array
          items:
            type: object
            required:
              - term
              - checked_layers
              - hit
            properties:
              term:
                type: string
                description: 查询中的关键术语。
              checked_layers:
                type: array
                items:
                  type: string
                description: 检查过的层级。
              hit:
                type: boolean
                description: 是否在任何召回条目中命中。
              hint:
                type: string
                description: 缺口提示（如"建议查证"/"知识库可能缺失"/"分词未对齐"等）。
        recommended_actions:
          type: array
          items:
            type: string
          description: |
            系统建议的下一步动作。可能值：
            - "proceed_with_confidence"（高置信，可直接回答）
            - "verify_before_use"（部分覆盖，需查证）
            - "supplement_with_search"（缺口明显，建议补充外部检索）
            - "escalate_to_human"（关键方面完全缺失）
            - "retrieve_quality_poor_investigate"（召回质量差，先查 retrieve 算法而非归档知识）
    RuleGateCheckRequest:
      type: object
      required: [task_request_id, operation]
      properties:
        task_request_id:
          type: string
          format: uuid
        task_step_id:
          type: string
          format: uuid
        task_type:
          type: string
          enum: [design, execution, debugging, governance, review, ingestion, integration, answer]
        task_phase:
          type: string
          enum: [planning, design, coding, testing, review, governance, reporting, integration]
          description: Optional lifecycle phase for rule gate routing.
        host:
          type: string
        project_ref:
          type: string
        operation:
          type: string
        checkpoint_keys:
          type: array
          items:
            type: string
        evidence:
          type: object
          additionalProperties: true
        actor_ref:
          type: string
    RuleGateCheckResponse:
      type: object
      required: [allowed, decision, operation, matched_checkpoint_count, checkpoints, audit_ids]
      properties:
        allowed:
          type: boolean
        decision:
          type: string
          enum: [allow, warn, ask_user, block]
        operation:
          type: string
        matched_checkpoint_count:
          type: integer
        checkpoints:
          type: array
          items:
            type: object
            additionalProperties: true
        audit_ids:
          type: array
          items:
            type: string
            format: uuid
        rule_hotplug_note:
          type: string
    GovernanceRunRequest:
      type: object
      required: [task_request_id]
      properties:
        task_request_id:
          type: string
          format: uuid
        task_step_id:
          type: string
          format: uuid
        fingerprint:
          type: string
        rebuild_resident:
          type: boolean
        sync_index:
          type: boolean
        run_lifecycle:
          type: boolean
    GovernanceRunResponse:
      type: object
      required:
        - summary_ids
        - persisted_memory_ids
        - persisted_skill_ids
        - index_sync
        - lifecycle
      properties:
        summary_ids:
          type: array
          items:
            type: string
            format: uuid
        rebuilt_snapshot_id:
          type: string
          format: uuid
        persisted_memory_ids:
          type: array
          items:
            type: string
            format: uuid
        persisted_skill_ids:
          type: array
          items:
            type: string
            format: uuid
        drift_check_result_ids:
          type: array
          items:
            type: string
            format: uuid
        reconciliation_item_ids:
          type: array
          items:
            type: string
            format: uuid
        zombie_state_ids:
          type: array
          items:
            type: string
            format: uuid
        index_sync:
          type: object
          additionalProperties: true
        lifecycle:
          type: object
          additionalProperties: true
    KnowledgeGovernanceJobCreateRequest:
      type: object
      required: [job_type, trigger_type]
      properties:
        job_type:
          type: string
        trigger_type:
          type: string
        trigger_ref:
          type: string
        target_object_type:
          type: string
        target_object_ids:
          type: array
          items:
            type: string
            format: uuid
        priority:
          type: integer
        payload:
          type: object
          additionalProperties: true
    KnowledgeGovernanceJobCreateResponse:
      type: object
      required: [job_id, status, queued_at]
      properties:
        job_id:
          type: string
          format: uuid
        status:
          type: string
        queued_at:
          type: string
          format: date-time
    KnowledgeGovernanceJobResponse:
      type: object
      required: [job_id, job_type, status, created_objects, updated_objects, warnings, trace]
      properties:
        job_id:
          type: string
          format: uuid
        job_type:
          type: string
        status:
          type: string
        decision:
          type: string
        created_objects:
          type: array
          items:
            type: string
        updated_objects:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        trace:
          type: object
          additionalProperties: true
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    KnowledgeGovernanceRunRequest:
      type: object
      required: [task_request_id]
      properties:
        task_request_id:
          type: string
          format: uuid
        task_step_id:
          type: string
          format: uuid
        candidate_ids:
          type: array
          items:
            type: string
            format: uuid
        run_modes:
          type: array
          items:
            type: string
        max_items:
          type: integer
        include_graph_governance:
          type: boolean
        include_summary_rebuild:
          type: boolean
        include_resident_rebuild:
          type: boolean
        include_staleness_scan:
          type: boolean
