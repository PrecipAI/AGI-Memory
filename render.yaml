# Render 部署配置：https://render.com/docs/blueprint-spec
# 纯静态部署：仪表盘 demo，无需后端/数据库
# 部署 public/ 目录，访问时自动跳转 ?demo=1 使用 mock 数据（42 skill + 7 memory + 5 rule）

services:
  - type: web
    name: agi-memory-dashboard
    runtime: static
    plan: free
    staticPublishPath: ./services/memory-service/public
    # 单页应用：所有路径都返回 index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
